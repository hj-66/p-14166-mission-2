<html layout:decorate="~{layout}">
<div layout:fragment="content" class="container my-3">
  <div class="my-3 border-bottom">
    <div>
      <h4>비밀번호 찾기</h4>
    </div>
  </div>

  <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
  <div th:if="${resetUrl}" class="alert alert-secondary">
    <span>개발용 재설정 링크: </span>
    <a th:href="${resetUrl}" th:text="${resetUrl}"></a>
  </div>

  <form th:action="@{/user/password/forgot}" th:object="${passwordResetRequestForm}" method="post">
    <div th:replace="~{form_errors :: formErrorsFragment}"></div>
    <div class="mb-3">
      <label for="email" class="form-label">이메일</label>
      <input type="email" th:field="*{email}" class="form-control">
    </div>
    <button type="submit" class="btn btn-primary">재설정 요청</button>
  </form>
</div>
</html>
