<html layout:decorate="~{layout}">
<div layout:fragment="content" class="container my-3">
  <div class="my-3 border-bottom">
    <div>
      <h4>프로필</h4>
    </div>
  </div>

  <table class="table">
    <tbody>
    <tr>
      <th class="table-light" style="width: 160px;">사용자ID</th>
      <td th:text="${user.username}"></td>
    </tr>
    <tr>
      <th class="table-light">이메일</th>
      <td th:text="${user.email}"></td>
    </tr>
    </tbody>
  </table>

  <div class="mt-3">
    <a class="btn btn-primary" th:href="@{/user/password/change}">비밀번호 변경</a>
    <a class="btn btn-outline-secondary" th:href="@{/question/list}">목록으로</a>
  </div>

  <h5 class="border-bottom my-3 py-2">내 질문</h5>
  <div th:if="${#lists.isEmpty(questionList)}" class="alert alert-secondary">
    작성한 질문이 없습니다.
  </div>
  <table th:unless="${#lists.isEmpty(questionList)}" class="table">
    <thead class="table-dark">
    <tr class="text-center">
      <th style="width: 80px;">번호</th>
      <th>제목</th>
      <th style="width: 180px;">작성일시</th>
    </tr>
    </thead>
    <tbody>
    <tr class="text-center" th:each="question, loop : ${questionList}">
      <td th:text="${loop.count}"></td>
      <td class="text-start">
        <a th:href="@{|/question/detail/${question.id}|}" th:text="${question.subject}"></a>
      </td>
      <td th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"></td>
    </tr>
    </tbody>
  </table>

  <h5 class="border-bottom my-3 py-2">내 답변</h5>
  <div th:if="${#lists.isEmpty(answerList)}" class="alert alert-secondary">
    작성한 답변이 없습니다.
  </div>
  <table th:unless="${#lists.isEmpty(answerList)}" class="table">
    <thead class="table-dark">
    <tr class="text-center">
      <th style="width: 80px;">번호</th>
      <th>답변 내용</th>
      <th style="width: 220px;">질문</th>
      <th style="width: 180px;">작성일시</th>
    </tr>
    </thead>
    <tbody>
    <tr class="text-center" th:each="answer, loop : ${answerList}">
      <td th:text="${loop.count}"></td>
      <td class="text-start">
        <a th:href="@{|/question/detail/${answer.question.id}|}" th:text="${answer.content}"></a>
      </td>
      <td class="text-start">
        <a th:href="@{|/question/detail/${answer.question.id}|}" th:text="${answer.question.subject}"></a>
      </td>
      <td th:text="${#temporals.format(answer.createDate, 'yyyy-MM-dd HH:mm')}"></td>
    </tr>
    </tbody>
  </table>
</div>
</html>
